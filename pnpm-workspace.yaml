# Require explicit review for dependency installation scripts.
strictDepBuilds: true
allowBuilds:
  # Sass uses prebuilt watcher binaries; compilation does not require this build.
  '@parcel/watcher': false
# Explicitly reviewed latest Sass and Electron releases; retain the age gate for other packages.
minimumReleaseAgeExclude:
  - sass@1.106.0
  - electron@45.0.0
overrides:
  '@electron/asar>glob': '14.0.2'
  minimatch: '11.0.1'
