name: Validate package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      pdf:
        description: Run PDF checks on a self-hosted runner with Prince and Poppler
        type: boolean
        default: false
  schedule:
    - cron: '21 7 * * 1'

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.22.0', '26']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm run check:package-manager
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run build
      - run: pnpm run test:package
      - run: pnpm run test:git
      - run: pnpm audit
      - run: pnpm audit --prod
      - run: git diff --exit-code

  electron:
    name: Electron / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0t64 libnss3 libasound2t64
      - name: Allow Chromium to create its Linux user-namespace sandbox
        if: runner.os == 'Linux'
        run: |
          if test -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: xvfb-run --auto-servernum pnpm run test:electron
        if: runner.os == 'Linux'
      - run: pnpm run test:electron
        if: runner.os != 'Linux'
      - run: git diff --exit-code

  pdf:
    if: github.event_name == 'workflow_dispatch' && inputs.pdf
    runs-on: [self-hosted, prince]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:pdf
        env:
          CROSS_DOC_PDF_ARTIFACTS: ${{ runner.temp }}/cross-doc-pdf
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: pdf-review
          path: ${{ runner.temp }}/cross-doc-pdf
          if-no-files-found: warn
