background: >
  Until recently has been, grudgingly, working for his father (e.g. during in

  the Antonovich Elimination his job).

  He is currently on secondment to SATT where he has an office near

  Alexia's.


  He has several siblings and generic testing has confirmed

  he shares a father (but not a mother) with Llŷr ap Leda.


  Currently living with Michelle at his home in Lambeth.


  His mother was (according to his father) a temple maiden but he knows nothing

  more of her, and was punished by his father when he asked about her. There is

  nothing about her recorded in the book of births, although that isn't the case

  for many of his brothers. Jonny is

  reported to be the spitting image of him which suggests he may be his brother.


  He bears Kladenets

  and Brainbiter (after drawing it from SATT's

  keystone).


  See the Pendragon Family for details of his siblings

  although, of them, he only really gets along with Happy and

  Metty now he knows her true nature.


  He feels a certain kinship to Mark via shared parental issues and has

  started to take the young scion under his wing.


  He was trained in piloting by Charles Nungesser.


  Known associates include:


  - Benny

  - Dr. Richard Mayweather

  - Michelle Devereaux

  - Seb

  - Jeremy Brand


  Mordred’s office at SATT is a standard SATT office across the corridor from

  Alexia's into which he has put some nicer furniture (with leanings

  towards mahogany and leather). There's a whiteboard positioned where it cannot

  be seen from the window, vaguely sensitive documents are locked away when he

  isn't there, and really sensitive documents are destroyed.


  He keeps a couple of books in a drawer — The Prince (which he finds a useful

  reminder of his father's state of mind) and the Merchant of Venice (which

  resonates with him) — and his work laptop gets dropped on top of them and
  locked

  away at night.


  He keeps a deactivated pistol the used to belong to a

  mobster as a reminder of lessons learned during an early

  mission. It used to live inside a puzzle

  box before it was moved for security reasons.


  Sometimes copies of academic papers he is working can be found there.


  There are a few bottles of alcohol locked away in various drawers, but most
  are

  used for bribing people (such as Jerry. The bottle of mead in his

  desk drawer is the exception.


  He claims to have woken up in the Paris catacombs after one night of

  particularly heavy drinking. This is true, and as a

  consequence he is an associate member of Société du Cinéma Secrètement

  Parisien].


  He is the subject of a prophecy about swords by

  Roxanne.


  A member of White's.


  ## Red, Morton


  Mordred does academic work under the alias "Morton Red".


  * 2018 Journal article: Swords: Manifestations of power, position, and ego 

  * 2019         Lecture series: Swords: From weapon to ceremonial
  object          |

  * 2022         Lecture series: Swords in Art, Swords as
  Art                       

  * Forthcoming Doctoral thesis: Comparative Mythology: Warrior Kings of
  Europe     



  ## Dawson, Mickey


  An alias that Mordred used to get a S.I.A. Private Investigator business

  licence. He finds it useful to get access to a range of contacts and launder

  money when he is doing work funded by his father.


  ## Lambeth home


  Mordred lives in what used to be a small Protestant parish church in Lambeth.


  It is watched over by Ziczzisisieieistsi, the ice elemental.


  During WWII an unexploded bomb exploded there under Henry's watch.


  Before the church was built, it was royal land.


